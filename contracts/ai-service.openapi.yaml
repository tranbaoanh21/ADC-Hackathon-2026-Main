openapi: 3.1.0
info:
  title: PathMemory Internal AI Service API
  version: 1.0.0
  description: >-
    Canonical Express-to-FastAPI contract. Hồng Phúc owns the FastAPI producer;
    Bảo Anh owns the Express consumer. The service returns perception only and
    never returns navigation, publication or safety decisions.
servers:
  - url: https://ai.internal.example.invalid
    description: Placeholder only; configure through AI_SERVICE_URL.
paths:
  /health:
    get:
      summary: Check FastAPI process health without invoking the model
      operationId: getHealth
      responses:
        '200':
          description: Service process is ready to accept requests
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, schemaVersion]
                properties:
                  status:
                    type: string
                    const: ok
                  schemaVersion:
                    type: string
                    const: '1.0'
  /internal/v1/perception:
    post:
      summary: Extract independent structured perception from ephemeral frames
      operationId: createPerception
      security:
        - InternalServiceToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, locale, analysisMode, frames]
              properties:
                requestId:
                  type: string
                  minLength: 1
                  maxLength: 100
                locale:
                  type: string
                  minLength: 2
                  maxLength: 20
                  example: vi-VN
                analysisMode:
                  type: string
                  enum: [LANDMARK_DISCOVERY, LANDMARK_OBSERVATION]
                  description: >-
                    Chooses the extraction prompt only. Neither mode may return
                    a final route-match or navigation action.
                frames:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                    format: binary
            encoding:
              frames:
                contentType: image/jpeg, image/png
      responses:
        '200':
          description: Validated perception result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerceptionResponse'
              examples:
                success:
                  externalValue: ./examples/ai-perception-success.json
        '401':
          description: Missing or invalid internal service credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiErrorResponse'
        '413':
          description: Frame count or payload exceeds configured limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiErrorResponse'
        '422':
          description: Multipart metadata or frame format is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiErrorResponse'
              examples:
                validation:
                  externalValue: ./examples/ai-validation-error.json
        '503':
          description: Provider unavailable or configured circuit is open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiErrorResponse'
              examples:
                provider:
                  externalValue: ./examples/ai-provider-error.json
        '504':
          description: Provider exceeded the FastAPI timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiErrorResponse'
components:
  securitySchemes:
    InternalServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
      description: Server-side credential shared only between Express and FastAPI.
  schemas:
    PerceptionResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - requestId
        - frameQuality
        - detectedText
        - sceneType
        - landmarkCandidates
        - uncertaintyReasons
        - model
        - processingTimeMs
      properties:
        schemaVersion:
          type: string
          const: '1.0'
        requestId:
          type: string
          minLength: 1
          maxLength: 100
        frameQuality:
          type: string
          enum: [USABLE, BLURRY, TOO_DARK, OBSTRUCTED, UNREADABLE]
        detectedText:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 150
        sceneType:
          type: string
          enum: [RECEPTION, ELEVATOR_AREA, CORRIDOR, ROOM_ENTRANCE, OTHER, UNKNOWN]
        landmarkCandidates:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/LandmarkCandidate'
        uncertaintyReasons:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 200
          description: Plain-language limitations, not model confidence probabilities.
        model:
          $ref: '#/components/schemas/ModelMetadata'
        processingTimeMs:
          type: integer
          minimum: 0
          description: FastAPI-side processing time; not end-to-end user latency.
    LandmarkCandidate:
      type: object
      additionalProperties: false
      required: [proposedName, type, visibleText, stableFeatures, draftDescription]
      properties:
        proposedName:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [SIGN, ROOM_ENTRANCE, RECEPTION, ELEVATOR_AREA, CORRIDOR_MARKER, OTHER]
        visibleText:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 100
        stableFeatures:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 150
        draftDescription:
          type: string
          minLength: 1
          maxLength: 300
        transientFeatures:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 150
          description: Observed but unsuitable for landmark identity; Express must not use as proof.
    ModelMetadata:
      type: object
      additionalProperties: false
      required: [provider, modelId, promptVersion]
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 50
        modelId:
          type: string
          minLength: 1
          maxLength: 100
        promptVersion:
          type: string
          minLength: 1
          maxLength: 50
    AiErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - VALIDATION_ERROR
                - PAYLOAD_TOO_LARGE
                - PROVIDER_UNAVAILABLE
                - PROVIDER_TIMEOUT
                - PROVIDER_INVALID_RESPONSE
            message:
              type: string
              minLength: 1
              maxLength: 300
            retryable:
              type: boolean
            requestId:
              type: string
              maxLength: 100
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, issue]
                properties:
                  field:
                    type: string
                  issue:
                    type: string
